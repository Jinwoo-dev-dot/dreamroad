name: CamStudy
options:
  bundleIdPrefix: com.camstudy
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  CamStudy:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CamStudy
        excludes:
          - "Resources/GoogleService-Info.plist.example"
    resources:
      - path: CamStudy/Resources/GoogleService-Info.plist
        optional: true
    info:
      path: CamStudy/Info.plist
      properties:
        UILaunchScreen: {}
    entitlements:
      path: CamStudy/CamStudy.entitlements
      properties:
        com.apple.developer.family-controls: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.camstudy.app
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseCore
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.29.0
